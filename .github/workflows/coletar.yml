# Coleta semanal: lê as fontes, verifica os links, sugere competências e publica.
# "Run workflow" na aba Actions dispara na hora.
name: Coletar catálogo
on:
  schedule:
    - cron: "0 9 * * 1"        # toda segunda-feira, 9h UTC (6h em Brasília)
  workflow_dispatch: {}
permissions:
  contents: write              # para gravar dados/ e docs/ no próprio repositório
concurrency:
  group: catalogo              # coleta e verificação nunca gravam ao mesmo tempo
  cancel-in-progress: false
jobs:
  coletar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - run: python coletor/coletar.py
      - run: python coletor/verificar_links.py
      - run: python coletor/sugerir.py
      - name: Gravar o resultado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados/catalogo.json docs/catalogo.json
          git diff --cached --quiet || git commit -m "Catálogo: coleta de $(date -u +%F)"
          git push
