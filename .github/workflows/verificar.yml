# Verificação diária dos links: o "verificador de links online".
name: Verificar links
on:
  schedule:
    - cron: "0 10 * * *"       # todo dia, 10h UTC (7h em Brasília)
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: catalogo
  cancel-in-progress: false
jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - run: python coletor/verificar_links.py
      - name: Gravar o resultado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados/catalogo.json docs/catalogo.json
          git diff --cached --quiet || git commit -m "Links verificados em $(date -u +%F)"
          git push
